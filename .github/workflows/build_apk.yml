name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # الرفع من الهاتف يضع الملفات في الجذر. هذه الخطوة ترتّبها في مجلداتها:
      # 1) الأسماء القديمة (main.dart ...) تُنقل لأماكنها
      # 2) أي ملف اسمه يحوي "__" يُحوَّل إلى مسار، مثال:
      #    lib__screens__cv_screen.dart  ->  lib/screens/cv_screen.dart
      #    (وتتفوق النسخة الجديدة على القديمة)
      - name: Organize flat files into folders
        run: |
          mkdir -p lib/models lib/services lib/screens assets/fonts
          [ -f main.dart ] && mv main.dart lib/main.dart || true
          [ -f cv_data.dart ] && mv cv_data.dart lib/models/ || true
          for f in pdf_service recent_service; do
            [ -f $f.dart ] && mv $f.dart lib/services/ || true
          done
          for f in home_screen cv_screen reader_screen saved_files_screen; do
            [ -f $f.dart ] && mv $f.dart lib/screens/ || true
          done
          [ -f .gitkeep ] && mv .gitkeep assets/fonts/ || true
          for f in *__*; do
            [ -f "$f" ] || continue
            dest="${f//__//}"
            mkdir -p "$(dirname "$dest")"
            mv -f "$f" "$dest"
          done
          ls -R lib

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform files
        run: flutter create --platforms=android --project-name cv_reader_app --org com.example.cvreader .

      - name: Download bundled fonts
        run: |
          mkdir -p assets/fonts
          for f in Tajawal-Regular Tajawal-Bold; do
            if [ ! -s "assets/fonts/$f.ttf" ]; then
              curl -fL --retry 3 -o "assets/fonts/$f.ttf" \
                "https://raw.githubusercontent.com/google/fonts/main/ofl/tajawal/$f.ttf"
            fi
          done
          ls -l assets/fonts

      - name: Set app label
        run: sed -i 's|android:label="[^"]*"|android:label="سيرتي"|' android/app/src/main/AndroidManifest.xml

      # 1) بعض الإضافات تُترجم على Android 34 بينما تعتمد عليها مكتبات تطلب 36
      # 2) تعطيل فحص Lint الذي ينهار أثناء بناء release ولا يؤثر على الـ APK
      - name: Gradle fixes (compileSdk and lint)
        run: |
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/fixes.gradle <<'EOF'
          allprojects {
              afterEvaluate { p ->
                  if (p.name != 'app' && p.hasProperty('android')) {
                      p.android.compileSdkVersion 36
                  }
              }
              tasks.configureEach { t ->
                  if (t.name.startsWith('lint')) {
                      t.enabled = false
                  }
              }
          }
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
